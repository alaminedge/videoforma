name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Rebuild folders from flat names
        run: |
          for f in app__*; do
            p="${f//__//}"
            mkdir -p "$(dirname "$p")"
            mv "$f" "$p"
          done
      - run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MomConverter
          path: app/build/outputs/apk/debug/app-debug.apk
